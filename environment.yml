name: sage-or
channels:
  - conda-forge
  - defaults

dependencies:
  # Python 3.12 for SAM3 compatibility
  - python=3.12

  # System-level scientific computing
  - numpy>=1.26.0,<2
  - scipy>=1.10.0
  - opencv>=4.8.0
  - pillow>=9.5.0

  # Development and system utilities
  - git
  - git-lfs
  - psutil>=5.9.0
  - pip

  # Pip dependencies (see requirements.txt for details)
  - pip:
    - -r requirements.txt

